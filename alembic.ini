# LeadStack's own Alembic history (SaaS-OS ADR-0016).
# Author a revision:   uv run alembic revision -m "..."
# Apply migrations:    uv run leadstack-migrate upgrade   (runs SaaS-OS's history first)
# The database URL is never written here: env.py reads MIGRATIONS_DATABASE_URL
# through SaaS-OS's secrets provider.
[alembic]
script_location = %(here)s/src/leadstack/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(name)s] %(message)s
